name: Release

on:
  push:
    tags:
      - '*'

# The workflow creates a release, and needs to be allowed to. The other two
# let it sign the release files (see "Attest" below).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # See the note in ci.yml — jsdom 30/undici 8 need Node 22 or newer.
          node-version: '24'
          cache: npm
      - run: npm ci
      # The same checks CI runs on every push. A tag is not a reason to
      # skip them — it is the one build anyone will actually install.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Signs a provenance statement for each file a user installs, so anyone
      # can check it was built by this workflow from this commit:
      #   gh attestation verify main.js --repo user3019/InklingExpanded
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Published straight away: BRAT installs and updates from published
      # releases only, so a draft would never reach a device. The checks
      # above are what stand between a tag and an install.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
